name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matlab-tests:
    name: MATLAB unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Signal_Processing_Toolbox

      # source-folder puts the repository ROOT on the path (never +stimgen
      # itself, which MATLAB resolves as a package); the engine tests add
      # documentation/tools for SimRigAdapter themselves.
      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: .
          select-by-folder: tests
